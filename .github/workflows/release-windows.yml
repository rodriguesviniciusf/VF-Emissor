name: Publicar VF Emissor para Windows
on:
  push:
    branches: ['main']
    paths: ['version.json']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preparar Python embarcado e dependências públicas
        shell: pwsh
        run: python .\scripts\bootstrap_windows.py
      - name: Validar versão e Python portátil
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag e version.json precisam coincidir.' }
          & .\portable\python.exe -m unittest discover -s base -p 'test_*.py'
          if ($LASTEXITCODE) { throw 'Testes do motor falharam.' }
          & .\portable\python.exe -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE) { throw 'Testes web/desktop falharam.' }
          node --check .\static\assistance-ui.js
          if ($LASTEXITCODE) { throw 'JavaScript de assistência inválido.' }
          node --check .\static\interstate-ui.js
          if ($LASTEXITCODE) { throw 'JavaScript interestadual invalido.' }
          node --check .\static\ncm-ui.js
          if ($LASTEXITCODE) { throw 'JavaScript NCM invalido.' }
          node --check .\static\simple-ui.js
          if ($LASTEXITCODE) { throw 'JavaScript do Modo Simples inválido.' }
          node --test .\tests\certificate-ui.test.cjs
          if ($LASTEXITCODE) { throw 'Regressao do certificado na interface.' }
          node --check .\static\access-ui.js
          if ($LASTEXITCODE) { throw 'Interface de acesso invalida.' }
          node --check .\portal\app.js
          if ($LASTEXITCODE) { throw 'Painel administrativo invalido.' }
          node --check .\portal\auth.js
          if ($LASTEXITCODE) { throw 'Recuperacao de acesso invalida.' }
          node --test .\tests\portal-auth.test.cjs
          if ($LASTEXITCODE) { throw 'Falha na recuperacao de acesso.' }
          node --test .\tests\access-edge.test.cjs
          if ($LASTEXITCODE) { throw 'Falha no servico de licencas.' }
          $deps = Join-Path $env:RUNNER_TEMP 'vf-sql-tests'
          npm install --prefix $deps @electric-sql/pglite@0.5.16
          if ($LASTEXITCODE) { throw 'Falha ao preparar PostgreSQL de teste.' }
          $env:VF_PGLITE_PATH = Join-Path $deps 'node_modules/@electric-sql/pglite'
          node --test .\tests\access-sql.test.cjs
          if ($LASTEXITCODE) { throw 'Falha nas regras de autorizacao.' }
      - name: Conferir disponibilidade das consultas públicas
        shell: pwsh
        run: .\portable\python.exe .\scripts\check_public_lookups.py
      - name: Instalar compilador do instalador
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Compilar instalador com o canal deste repositório
        shell: pwsh
        run: .\scripts\build-release.ps1 -Repository "$env:GITHUB_REPOSITORY"
      - name: Conferir instalação, atalho e preservação de dados
        shell: pwsh
        run: .\scripts\smoke-install.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VF-Emissor-Windows
          path: dist/*
      - name: Publicar versão estável
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          gh release create "v$version" "dist/VF-Emissor-Setup-$version.exe" "dist/update-manifest.json" --target "$env:GITHUB_SHA" --title "VF Emissor $version" --notes-file RELEASE-NOTES.md --latest
      - name: Conferir atualizacao publica da versao anterior
        shell: pwsh
        run: python .\scripts\verify_published_update.py
